<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BeneSim" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a1226" />
    <title>BeneSim – Tecnam flight sim · LKBE Benešov</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
    <canvas id="panel"></canvas>
    <canvas id="map"></canvas>
    <div id="msg"></div>
    <div id="radio"></div>
    <div id="loading">
      <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#081329" /><stop offset="0.34" stop-color="#1c3564" /><stop offset="0.6" stop-color="#7a5279" />
            <stop offset="0.8" stop-color="#e2825a" /><stop offset="1" stop-color="#f8c97f" />
          </linearGradient>
          <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#fff1c2" stop-opacity="0.95" /><stop offset="0.12" stop-color="#ffd58a" stop-opacity="0.75" />
            <stop offset="0.45" stop-color="#f59a5e" stop-opacity="0.25" /><stop offset="1" stop-color="#f59a5e" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24243a" /><stop offset="1" stop-color="#0a0d18" /></linearGradient>
          <linearGradient id="rwy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5468" /><stop offset="0.25" stop-color="#3a3348" /><stop offset="1" stop-color="#181a26" /></linearGradient>
          <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4a78" /><stop offset="1" stop-color="#f0a079" /></linearGradient>
        </defs>
        <rect width="1600" height="640" fill="url(#sky)" />
        <g class="stars" fill="#fff">
          <circle cx="160" cy="70" r="1.6" /><circle cx="420" cy="140" r="1.2" /><circle cx="610" cy="48" r="1.4" /><circle cx="1210" cy="90" r="1.6" />
          <circle cx="1390" cy="40" r="1.1" /><circle cx="1500" cy="170" r="1.3" /><circle cx="300" cy="230" r="1" /><circle cx="960" cy="36" r="1.2" />
        </g>
        <circle cx="1040" cy="598" r="420" fill="url(#glow)" />
        <circle cx="1040" cy="598" r="46" fill="#fff3cf" />
        <g class="clouds c1" fill="url(#cloud)" opacity="0.55">
          <ellipse cx="260" cy="330" rx="190" ry="16" /><ellipse cx="330" cy="318" rx="110" ry="14" /><ellipse cx="1260" cy="270" rx="230" ry="15" /><ellipse cx="1180" cy="258" rx="120" ry="12" />
        </g>
        <g class="clouds c2" fill="url(#cloud)" opacity="0.4">
          <ellipse cx="700" cy="430" rx="260" ry="11" /><ellipse cx="1500" cy="470" rx="180" ry="9" /><ellipse cx="80" cy="480" rx="150" ry="8" />
        </g>
        <path d="M0 600 C 140 560 260 575 380 560 S 620 540 760 566 S 1000 590 1120 560 S 1380 548 1600 572 V 640 H 0 Z" fill="#8a5a72" opacity="0.75" />
        <!-- Konopiště on the far hill -->
        <g fill="#6c4762" opacity="0.9" transform="translate(566 530)">
          <rect x="0" y="22" width="70" height="22" /><rect x="-6" y="8" width="14" height="36" /><rect x="62" y="6" width="14" height="38" /><rect x="28" y="12" width="16" height="32" />
          <path d="M-8 9 L1 -6 L10 9 Z M60 7 L69 -8 L78 7 Z M26 13 L36 -4 L46 13 Z" />
        </g>
        <path d="M0 622 C 120 600 220 612 340 598 S 560 584 700 606 S 940 626 1080 604 S 1360 590 1600 610 V 660 H 0 Z" fill="#4a3553" />
        <path d="M0 650 L0 628 q12 -14 24 0 q10 -18 22 -2 q14 -12 26 2 q12 -16 24 0 q8 -10 20 -2 q14 -18 28 0 q10 -12 22 0 l40 8 q14 -14 28 0 q10 -16 22 0 q12 -10 24 2 L 520 640 L 1060 640 q12 -16 26 -2 q10 -14 24 0 q12 -18 26 -2 q12 -10 22 2 q14 -16 28 0 q10 -12 24 0 q12 -18 26 -2 q10 -10 22 2 q14 -16 26 0 q12 -14 24 0 q12 -18 26 -2 q12 -8 22 2 q12 -12 24 0 q10 -14 22 0 q12 -16 26 0 L 1600 632 V 660 H 0 Z" fill="#2a2338" />
        <rect y="640" width="1600" height="260" fill="url(#field)" />
        <path d="M770 640 L830 640 L1180 900 L420 900 Z" fill="url(#rwy)" />
        <path d="M770 640 L420 900 M830 640 L1180 900" stroke="#f3d2a8" stroke-opacity="0.35" stroke-width="3" />
        <path d="M800 900 L800 642" stroke="#f6e7d0" stroke-opacity="0.75" stroke-width="7" stroke-dasharray="46 40" />
        <g fill="#f6e7d0" opacity="0.55">
          <path d="M470 900 L505 868 L535 868 L507 900 Z M548 900 L566 868 L594 868 L583 900 Z M626 900 L630 868 L656 868 L660 900 Z" />
          <path d="M1130 900 L1095 868 L1065 868 L1093 900 Z M1052 900 L1034 868 L1006 868 L1017 900 Z M974 900 L970 868 L944 868 L940 900 Z" />
        </g>
        <text x="800" y="850" text-anchor="middle" fill="#f6e7d0" fill-opacity="0.5" font-size="74" font-weight="700" font-family="system-ui, sans-serif" transform="translate(800 850) scale(1 0.42) translate(-800 -850)">24</text>
        <g class="edge" fill="#ffc46b">
          <circle cx="760" cy="648" r="2" /><circle cx="840" cy="648" r="2" /><circle cx="730" cy="670" r="2.6" /><circle cx="870" cy="670" r="2.6" />
          <circle cx="690" cy="700" r="3.2" /><circle cx="910" cy="700" r="3.2" /><circle cx="630" cy="744" r="4" /><circle cx="970" cy="744" r="4" />
          <circle cx="545" cy="807" r="5" /><circle cx="1055" cy="807" r="5" />
        </g>
      </svg>
      <div class="plane">
        <!-- propeller (behind the airframe: seen from behind it is the far end of the aircraft): HTML layer so the compositor keeps it spinning while the main thread is busy loading -->
        <div class="prop"><svg viewBox="-80 -80 160 160" aria-hidden="true">
          <circle r="72" fill="#fff" fill-opacity="0.07" />
          <path d="M-4 -6 L-7 -70 Q0 -78 7 -70 L4 -6 Z M-4 6 L-7 70 Q0 78 7 70 L4 6 Z" fill="#fff" fill-opacity="0.38" />
        </svg></div>
        <svg viewBox="0 0 600 240" aria-hidden="true">
          <g fill="#0f1526" stroke="#f6a96f" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round">
            <path id="wingL" d="M300 146 L22 124 Q10 124 10 131 L12 136 L300 162 Z" />
            <use href="#wingL" transform="translate(600 0) scale(-1 1)" />
            <path d="M188 204 L214 154 M412 204 L386 154" stroke="#0f1526" stroke-width="6" stroke-linecap="round" />
            <ellipse cx="188" cy="208" rx="13" ry="22" /><ellipse cx="412" cy="208" rx="13" ry="22" />
            <path d="M300 168 L300 192" stroke="#0f1526" stroke-width="5" /><ellipse cx="300" cy="196" rx="8" ry="13" />
            <rect x="264" y="96" width="72" height="74" rx="34" />
            <ellipse cx="300" cy="98" rx="30" ry="24" fill="#33405e" />
            <path d="M206 120 L394 120 L394 127 L206 127 Z" />
            <path d="M296 124 L294 26 Q300 16 306 26 L304 124 Z" />
          </g>
          <circle class="nav" cx="12" cy="132" r="4" fill="#ff4a4a" /><circle class="nav" cx="588" cy="132" r="4" fill="#3dff7a" />
          <circle class="strobe" cx="300" cy="22" r="5" fill="#fff" />
        </svg>

      </div>
      <div class="brand">
        <div class="kicker">LKBE · Benešov</div>
        <h1>Bene<span>Sim</span></h1>
        <div class="tag">Tecnam P2002 &amp; P2006T · real Czech scenery</div>
      </div>
      <div class="card">
        <div class="row"><span id="loadtxt">Loading…</span><span id="loadpct">0 %</span></div>
        <div class="bar"><i id="loadbar"></i></div>
        <div class="tip"><b>TIP</b><span id="loadtip"></span></div>
        <button id="loadgo" type="button">▶ Start flying</button>
        <div class="hint" id="loadhint"></div>
      </div>
    </div>
    <div id="help" class="hidden"></div>
    <button id="restartBtn" class="hidden" type="button">↺ Restart</button>
    <div id="busted" class="hidden"><div class="big">BUSTED</div><div class="sub"></div></div>
    <div id="picker"></div>
    <div id="credit">© ČÚZK · © OpenStreetMap contributors · P2002 model © helijah (GPL)</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
